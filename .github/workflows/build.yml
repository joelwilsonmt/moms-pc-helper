name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Job 1: fast checks on macOS (no native compile needed) ──────────────────
  test:
    name: Typecheck & tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (skip native compile)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  # ── Job 2: Windows installer (needs job 1 to pass) ─────────────────────────
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (with scripts so native modules compile)
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        # Recompiles better-sqlite3-multiple-ciphers against Electron's Node ABI
        run: npx electron-builder install-app-deps

      - name: Build renderer + main
        run: npm run build

      - name: Package NSIS installer
        run: npx electron-builder --win --publish never
        env:
          # Unsigned for now — SmartScreen warns on first run; Joel clicks through.
          # To eliminate the warning: add CSC_LINK + CSC_KEY_PASSWORD repo secrets
          # pointing to a PFX code-signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MomsPCHelper-Setup-${{ github.run_number }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  # ── Job 3: attach installer to GitHub Release when a v* tag is pushed ───────
  release:
    name: Attach to GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: MomsPCHelper-Setup-${{ github.run_number }}
          path: dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
